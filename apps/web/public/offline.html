<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <title>BYE PRO FINANCE — غير متصل</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101114; color: #f2eee5; }
      main { width: min(92vw, 520px); padding: 32px; text-align: center; border: 1px solid #34363d; border-radius: 24px; background: #17191e; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: 1.8rem; }
      p { margin: 0 0 24px; color: #b8b8bf; line-height: 1.8; }
      button { border: 0; border-radius: 14px; padding: 12px 20px; background: #d4a62a; color: #101114; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تم حفظ نسخة من التطبيق على جهازك. أعد الاتصال بالإنترنت ثم حاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
