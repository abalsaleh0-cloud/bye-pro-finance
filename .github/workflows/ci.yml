name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@10.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all workspaces
        run: pnpm build
      - name: Build worker container image
        run: docker build -f Dockerfile.worker -t bye-pro-finance-worker:test .
      - name: Test document queue migrations against disposable PostgreSQL
        run: bash scripts/test-document-processing-migrations.sh
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
