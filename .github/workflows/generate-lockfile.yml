name: Generate pnpm lockfile

on:
  push:
    branches: [main]
    paths-ignore:
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pnpm-lockfile-main
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Resolve and generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1 && git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: add reproducible pnpm lockfile"
          git push origin HEAD:main
