name: Authentication E2E

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright test runner
        run: pnpm add -Dw @playwright/test@1.55.1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build web with isolated auth test configuration
        env:
          VITE_SUPABASE_URL: https://e2e-auth.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_test_key
        run: pnpm --filter @bye-pro-finance/web build
      - name: Run authentication E2E
        run: pnpm exec playwright test e2e/auth.spec.ts
